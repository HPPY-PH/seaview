name: Supabase keep-alive

# Free-tier Supabase projects are paused after 7 days of low database
# activity. This runs a tiny SELECT each day so the project stays awake.
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL     e.g. https://abcdefgh.supabase.co
#   SUPABASE_API_KEY the publishable key (sb_publishable_...) or, on older
#                    projects, the legacy anon key. Never the secret key —
#                    it bypasses Row Level Security.
#
# NOTE: GitHub disables scheduled workflows after 60 days with no commits
# to the repo. If the repo goes quiet, re-enable this from the Actions tab.

on:
  schedule:
    # 06:14 UTC daily. Deliberately not on the hour — GitHub's scheduler is
    # heavily contended at :00 and jobs get delayed or dropped.
    - cron: '14 6 * * *'
  workflow_dispatch: # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_API_KEY}" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_API_KEY is not set. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

          # Strip any trailing slashes. A secret pasted as "https://x.supabase.co/"
          # would otherwise build "...co//rest/v1/..." and PostgREST rejects the
          # double slash with PGRST125 (invalid path).
          base="${SUPABASE_URL%"${SUPABASE_URL##*[!/]}"}"
          echo "Target: ${base}/rest/v1/keepalive"

          # Hit a real table so the request reaches Postgres. A request that
          # never touches the database does not count as activity.
          #
          # The key goes on `apikey` only. Publishable keys (sb_publishable_...)
          # must NOT be sent on Authorization: Bearer, and omitting it works
          # for legacy anon keys too — PostgREST falls back to the anon role.
          status=$(curl -sS -o response.txt -w '%{http_code}' \
            --max-time 30 \
            --retry 3 --retry-delay 10 --retry-connrefused \
            "${base}/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: ${SUPABASE_API_KEY}")

          echo "HTTP ${status}"
          echo "Response: $(cat response.txt)"

          if [ "${status}" != "200" ]; then
            case "${status}" in
              401|403)
                echo "::error::HTTP ${status} — the key was rejected, or RLS is blocking anon reads on public.keepalive. Check the SELECT policy for the anon role." ;;
              404)
                echo "::error::HTTP 404 — PGRST205 means the keepalive table does not exist; PGRST125 means the URL path is malformed (check SUPABASE_URL for a trailing slash or a stray path). See the response above." ;;
              5*)
                echo "::error::HTTP ${status} — Supabase returned a server error. The project may be paused; open the dashboard to resume it." ;;
              *)
                echo "::error::Keep-alive query failed with HTTP ${status}. See the response above." ;;
            esac
            exit 1
          fi

          echo "Database responded — project is awake."
